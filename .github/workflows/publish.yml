# Lives in the subtree so it reaches ArmornetIO/showcase via `git subtree push`;
# armornet's own Actions never run it. npm's trusted publisher is bound to this
# repo + filename, so renaming the file breaks publishing until npm is updated.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # Node 22 ships npm 10; trusted publishing needs 11.5.1+.
      - run: npm install -g npm@^11.5.1
      - name: tag matches package.json
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run check
      - run: npm publish
