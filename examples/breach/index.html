<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>BREACH</title>
		<meta
			name="description"
			content="A 2v2 card game on the Armornet globe: two seats attack, two defend, twelve rounds."
		/>
		<!--
			Absolute on purpose. This is a public/ file, which Vite copies to the
			bundle root and rebases with `--base=/breach/` — a relative `./` href
			would instead be resolved as a module asset and 404 the copy in public/.
		-->
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<!--
			The dark, before there is any CSS to say so.

			`--bg` lives in `tokens.css`, which `app.css` imports and `main.ts`
			imports in turn — so in dev it is a stylesheet the browser has not been
			told about until a module graph has executed, and in a build it is a
			file that still has to be fetched. Until then the page is painted with
			the UA default, which is WHITE, and the game's first frame is a flash.
			It ran 450ms on the lobby, which boots the board and the wasm before it
			can paint anything.

			So the value is inlined here and duplicated on purpose: a literal is the
			only form of it that exists before the token does. It is the dark theme's
			`--bg` and has to be changed with it — anything else shows as a one-frame
			seam when the real stylesheet lands.
		-->
		<style>
			html,
			body {
				background: #05080d;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<!--
			Go's WebAssembly host shim. A classic script, not a module: it defines
			the global `Go` constructor the runtime needs, and it is copied here by
			`make build-breach-wasm` alongside armornet.wasm. Neither is committed.
		-->
		<script src="/wasm_exec.js"></script>
		<script type="module" src="/main.ts"></script>
	</body>
</html>
