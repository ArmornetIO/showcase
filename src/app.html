<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!--
		  Fonts are self-hosted from /fonts (see static/fonts/fonts.css). Loading
		  them from Google's CDN would send every visitor's IP to Google on first
		  paint, which our privacy policy says we don't do. Keep it local.
		-->
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/fonts.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
